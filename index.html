<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Page with Audio and Video</title>
</head>
<body>
    <h1> Welcome to our Audio/Video learning class</h1>

    <h2> Let's Listen to a Short Demo Audio</h2>
    <audio controls preload="none" loop autoplay muted>
        <source src="media/star_strike.mp3" type="audio/mpeg">
    </audio>

    <h2> Let's Watch a Short Demo Video</h2>
    <video controls poster="media/pic_beach.png" width="800" autoplay loop muted>
        <source src="media/beach_view.mp4" type="video/mp4" >
    </video>
    
</body>
</html>
